name: CI/CD Pipeline

on:
  push:
    branches: [main, production]

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, production]

  workflow_dispatch:
    inputs:
      deploy:
        description: "Run deployment"
        required: true
        default: "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        # --no-scripts Prevents filament:upgrade from running without a .env available
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  test:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Prepare Laravel application
        run: cp .env.testing .env

      - name: Execute test suite
        # Runs tests using the testing environment configuration
        run: php artisan test --env=testing

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/production') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'production') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'production')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies for production
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Set up Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend assets
        # Installs dependencies and generates production assets
        run: |
          npm ci
          npm run build

      - name: Upload compiled assets to VPS
        # Uploads compiled assets to the VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/build/
          remote_path: /home/moisescorchodev/htdocs/www.moisescorchodev.tech/public/build/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}

      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e  # Exit immediately if any command fails

            cd /home/moisescorchodev/htdocs/www.moisescorchodev.tech

            # Update application code
            git fetch origin
            git reset --hard origin/production

            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

            php artisan migrate --force --seed

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Ensure correct permissions for writable directories
            chmod -R 775 storage bootstrap/cache
