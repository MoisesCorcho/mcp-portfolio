name: CI/CD Pipeline

on:
  push:
    branches:
      - main        # Runs validation jobs only (no deployment)
      - production  # Runs validation and deployment jobs

  pull_request:
    branches:
      - main
      - production

  # Run only on pushes to production branch or manually
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run deployment"
        required: true
        default: "true"

jobs:

  # Job: Code style validation using Laravel Pint
  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        # Required to run Pint and other PHP tooling
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel Pint
        # Fails the job if code style violations are detected
        run: ./vendor/bin/pint --test

  # Job: Run automated tests
  test:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: lint   # Ensures tests run only if lint passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite  # SQLite used for in-memory testing

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel application
        # Creates environment configuration and application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute test suite
        # Runs tests using the testing environment configuration
        run: php artisan test --env=testing

  # Job: Deploy application to VPS
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Deploys on production branch pushes or manual trigger with deploy=true
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/production')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies for production
        # Installs only production dependencies with optimized autoload
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        # Installs dependencies and generates production assets
        run: |
          npm ci
          npm run build

      - name: Upload compiled assets to VPS
        # Transfers built assets to the server to avoid running Node.js in production
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/build/
          remote_path: /home/moisescorchodev/htdocs/www.moisescorchodev.tech/public/build/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}

      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e  # Exit immediately if any command fails

            cd /home/moisescorchodev/htdocs/www.moisescorchodev.tech

            # Update application code
            git pull origin production

            # Install PHP dependencies in production mode
            composer install --no-dev --optimize-autoloader --no-interaction

            # Run Laravel maintenance tasks
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Ensure correct permissions for writable directories
            chmod -R 775 storage bootstrap/cache
